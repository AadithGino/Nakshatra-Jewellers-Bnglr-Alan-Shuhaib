# Nginx reverse proxy for Nakshathra Scheme API
# Host: nakshatrabnglr.keralabilling.com → 127.0.0.1:2020
#
# Place at: /etc/nginx/sites-available/nakshathra-scheme-api
# Then:
#   sudo ln -sf /etc/nginx/sites-available/nakshathra-scheme-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nakshatrabnglr.keralabilling.com

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name nakshatrabnglr.keralabilling.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nakshatrabnglr.keralabilling.com;

    # Filled by Certbot:
    # ssl_certificate     /etc/letsencrypt/live/nakshatrabnglr.keralabilling.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nakshatrabnglr.keralabilling.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:2020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}
