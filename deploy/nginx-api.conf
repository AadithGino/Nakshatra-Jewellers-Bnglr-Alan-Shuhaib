# Nginx reverse proxy for Nakshathra Scheme API
# Same Lightsail box as your other apps — different subdomain, different local port (2020).
#
# Example:
#   yourdomain.com          → existing app (other nginx site)
#   api2.yourdomain.com     → this API  → 127.0.0.1:2020
#   schemes-api.yourdomain.com → this API (pick one subdomain)
#
# Place at: /etc/nginx/sites-available/nakshathra-scheme-api
# Then:
#   sudo ln -sf /etc/nginx/sites-available/nakshathra-scheme-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SUBDOMAIN.yourdomain.com

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name API_HOST_REPLACE_ME;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name API_HOST_REPLACE_ME;

    # Filled by Certbot:
    # ssl_certificate     /etc/letsencrypt/live/API_HOST_REPLACE_ME/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/API_HOST_REPLACE_ME/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:2020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}
