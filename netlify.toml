[build]
  command = "npm install && npm run build -w @nakshathra/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# --- API proxy to Lightsail (must stay ABOVE the SPA rule) ---
[[redirects]]
  from = "/api/*"
  to = "https://nakshatrabnglr.keralabilling.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://nakshatrabnglr.keralabilling.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/ready"
  to = "https://nakshatrabnglr.keralabilling.com/ready"
  status = 200
  force = true

# --- SPA: any path refresh serves index.html (no Netlify 404) ---
# status 200 = rewrite (not a browser redirect)
# no force = real files like /assets/*.js still load normally
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
