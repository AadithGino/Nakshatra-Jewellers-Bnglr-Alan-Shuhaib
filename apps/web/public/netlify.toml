# Copied into dist/ for Netlify folder/drag-drop deploys.
# (Root netlify.toml is only used for Git-connected builds.)

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
